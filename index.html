<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{

body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.app{display:flex;min-height:100vh}
/* SIDEBAR */

.sb-nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.2);padding:8px 8px 5px;margin-bottom:2px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:1px;font-size:13px;font-weight:500;color:rgba(255,255,255,.45)}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-lg{max-width:800px}
.modal-hd{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-tt{font-size:16px;font-weight:700}
.modal-cl{width:30px;height:30px;border-radius:7px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:18px;line-height:1;font-family:inherit}.modal-cl:hover{background:var(--border)}

.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* TOAST */
.toast-ct{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:toastIn .2s ease;min-width:220px}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--red)}.toast.info{border-left:3px solid var(--blue)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px}
.loading-sp{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.firebase-setup{padding:40px;text-align:center;max-width:500px}
.setup-title{font-size:24px;font-weight:700;margin-bottom:12px}
.setup-text{font-size:14px;color:var(--t2);margin-bottom:20px;line-height:1.6}
.setup-code{background:var(--bg);padding:20px;border-radius:8px;border:1px solid var(--border);margin-bottom:20px;text-align:left;font-family:monospace;font-size:12px;overflow-x:auto}
.bk-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}
.bk-tt{font-size:14px;font-weight:700;margin-bottom:8px}
.bk-dc{font-size:12px;color:var(--t2);margin-bottom:12px;line-height:1.5}
.bk-btns{display:flex;gap:10px;flex-wrap:wrap}
/* AGENDA */
.appt-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .1s}
.appt-item:last-child{border-bottom:none}.appt-item:hover{background:var(--bg)}
.appt-time{font-size:12px;font-weight:700;color:var(--blue);min-width:44px}

.date-tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.date-tab{display:flex;flex-direction:column;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:#fff;transition:all .15s;min-width:56px}
.date-tab:hover{border-color:var(--blue)}.date-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.dt-day{font-size:9px;font-weight:700;text-transform:uppercase;opacity:.55}
.dt-num{font-size:15px;font-weight:800}.dt-mon{font-size:9px;font-weight:500}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ── ÍCONES ──
const I={
  dash:'📊',pats:'👥',cal:'📅',pront:'📋',file:'📄',hist:'⏱',fin:'💰',
  bkup:'💾',add:'➕',edt:'✏️',del:'🗑',close:'✕',chk:'✓',sav:'💾'
};

// ── FIREBASE CONFIG ──
const firebaseConfig={
  apiKey:"AIzaSyAMzWGoXw9xOcN-1QRrX1mozxtMqrmFoHM",
  authDomain:"clinica-1df05.firebaseapp.com",
  projectId:"clinica-1df05",
  storageBucket:"clinica-1df05.firebasestorage.app",
  messagingSenderId:"892506337986",
  appId:"1:892506337986:web:1a45be0b3b2d3bc358815b"
};

let db=null;
let fbReady=false;
let fbError=null;

// Firebase será inicializado quando os dados forem salvos
// Por enquanto, apenas localStorage é usado (offline-first)

// ── TOAST ──
const useToast=()=>{
  const[ts,setTs]=useState([]);
  const add=useCallback((msg,type='info',dur=3000)=>{
    const id=Date.now();
    setTs(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setTs(p=>p.filter(t=>t.id!==id)),dur);
  },[]);
  return{add,ts};
};

const Toast=({ts})=>(
  <div className="toast-ct">
    {ts.map(({id,msg,type})=>(
      <div key={id} className={`toast ${type}`}>
        {type==='success'&&'✓ '}{type==='error'&&'✗ '}{msg}
      </div>
    ))}
  </div>
);

// ── FIREBASE UTILS ──
const fbOps={
  async read(col){
    if(!db) return[];
    try{
      const{collection,getDocs}=window.firebase.firestore;
      const snap=await getDocs(collection(db,col));
      return snap.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e){
      console.error(`Erro ao ler ${col}:`,e);
      return[];
    }
  },
  async create(col,data){
    if(!db) throw new Error('Firebase não inicializado');
    const{collection,addDoc}=window.firebase.firestore;
    const ref=await addDoc(collection(db,col),{...data,createdAt:new Date()});
    return{id:ref.id,...data};
  },
  async update(col,id,data){
    if(!db) throw new Error('Firebase não inicializado');
    const{doc,updateDoc}=window.firebase.firestore;
    await updateDoc(doc(db,col,id),{...data,updatedAt:new Date()});
  },
  async delete(col,id){
    if(!db) throw new Error('Firebase não inicializado');
    const{doc,deleteDoc}=window.firebase.firestore;
    await deleteDoc(doc(db,col,id));
  }
};

// ── HOOK SYNC FIREBASE + LOCAL ──
const useFirebaseDB=(collection,seedData)=>{
  const[data,setData]=useState(seedData||[]);
  const[loading,setLoading]=useState(true);
  const[online,setOnline]=useState(navigator.onLine);
  const localKey=`clinicpro_${collection}`;

  // Carregar dados (Firebase ou Local)
  useEffect(()=>{
    (async()=>{
      try{
        if(fbReady&&navigator.onLine){
          const fbData=await fbOps.read(collection);
          setData(fbData||seedData||[]);
          localStorage.setItem(localKey,JSON.stringify(fbData||seedData||[]));
        }else{
          const cached=localStorage.getItem(localKey);
          setData(cached?JSON.parse(cached):seedData||[]);
        }
      }catch(e){
        console.error('Erro ao carregar:',e);
        const cached=localStorage.getItem(localKey);
        setData(cached?JSON.parse(cached):seedData||[]);
      }finally{
        setLoading(false);
      }
    })();
  },[collection]);

  // Detectar online/offline
  useEffect(()=>{
    window.addEventListener('online',()=>setOnline(true));
    window.addEventListener('offline',()=>setOnline(false));
    return()=>{
      window.removeEventListener('online',()=>setOnline(true));
      window.removeEventListener('offline',()=>setOnline(false));
    };
  },[]);

  // Função de SET que sincroniza
  const setDataWithSync=useCallback(async(newData)=>{
    setData(newData);
    localStorage.setItem(localKey,JSON.stringify(newData));
    
    if(fbReady&&navigator.onLine){
      // Sincronizar cada item com Firebase
      for(const item of newData){
        try{
          if(item.id&&item.id.length>20){
            // ID de Firebase
            await fbOps.update(collection,item.id,item);
          }else if(!item.id){
            // Novo item
            await fbOps.create(collection,item);
          }
        }catch(e){
          console.error('Erro ao sincronizar:',e);
        }
      }
    }
  },[collection]);

  return[data,setDataWithSync,!loading,online];
};

// ── SEEDING ──
const SEED_PACS=[
  {id:'pac_1',nome:'João Silva',cpf:'123.456.789-00',tel:'(92)99999-1111',email:'joao@mail.com',dt_nasc:'1990-05-15',sexo:'M',endereco:'Rua A, 100',cidade:'Manaus',estado:'AM'},
  {id:'pac_2',nome:'Maria Santos',cpf:'987.654.321-00',tel:'(92)98888-2222',email:'maria@mail.com',dt_nasc:'1985-08-22',sexo:'F',endereco:'Rua B, 200',cidade:'Manaus',estado:'AM'},
];

const SEED_APPTS=[
  {id:'apt_1',paciente_id:'pac_1',data:'2024-01-15',hora:'09:00',tipo:'Consulta Geral',status:'confirmado'},
  {id:'apt_2',paciente_id:'pac_2',data:'2024-01-15',hora:'10:30',tipo:'Retorno',status:'confirmado'},
];

const SEED_PRONT=[
  {id:'pront_1',paciente_id:'pac_1',data:'2024-01-15',queixa:'Dor de cabeça',diagnostico:'Cefaleia tensional',prescricao:'Dipirona 500mg',status:'concluído'},
];

const SEED_LAUDOS=[
  {id:'laud_1',paciente_id:'pac_1',tipo:'Hemograma',resultado:'Normal',data:'2024-01-10'},
];

const SEED_FIN=[
  {id:'fin_1',tipo:'receita',descricao:'Consulta',valor:150.00,data:'2024-01-15',status:'recebido'},
];

// ── COMPONENTES ──

const Dashboard=({pacs,appts,laudos,pronts,fins,online})=>{
  const totalRec=fins.filter(f=>f.tipo==='receita').reduce((a,b)=>a+parseFloat(b.valor||0),0);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:24}}>
        {[['👥','Pacientes',pacs.length],['📅','Agendamentos',appts.length],['📋','Prontuários',pronts.length],['📄','Laudos',laudos.length]].map(([ico,lbl,val])=>(
          <div key={lbl} className="stat-card">
            <div className="stat-hd"><span className="stat-lbl">{lbl}</span><span style={{fontSize:18}}>{ico}</span></div>
            <div className="stat-val">{val}</div>
            <div className="stat-ch">registros</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-hd"><div className="card-tt">💰 Receita Total</div></div>
        <div style={{padding:20}}>
          <div style={{fontSize:32,fontWeight:800,color:'var(--green)'}}>R$ {totalRec.toFixed(2)}</div>
          <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>Período atual</div>
        </div>
      </div>
    </div>
  );
};

const PacsView=({pacs,setPacs,toast})=>{
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({nome:'',cpf:'',tel:'',email:'',dt_nasc:'',sexo:'M',endereco:'',cidade:'',estado:'AM'});

  const add=async()=>{
    if(!form.nome||!form.cpf){toast.add('Preencha nome e CPF','error');return;}
    try{
      setPacs([...pacs,{id:'pac_'+Date.now(),createdAt:new Date(),...form}]);
      setForm({nome:'',cpf:'',tel:'',email:'',dt_nasc:'',sexo:'M',endereco:'',cidade:'',estado:'AM'});
      setModal(null);
      toast.add('Paciente adicionado','success');
    }catch(e){
      toast.add('Erro ao adicionar','error');
    }
  };

  const edt=(p)=>{
    setForm(p);
    setModal('edit');
  };

  const upd=async()=>{
    try{
      setPacs(pacs.map(p=>p.id===form.id?form:p));
      setModal(null);
      toast.add('Paciente atualizado','success');
    }catch(e){
      toast.add('Erro ao atualizar','error');
    }
  };

  const del=async(id)=>{
    if(window.confirm('Tem certeza?')){
      try{
        setPacs(pacs.filter(p=>p.id!==id));
        toast.add('Paciente removido','success');
      }catch(e){
        toast.add('Erro ao remover','error');
      }
    }
  };

  return(
    <div>
      <div style={{marginBottom:18}}>
        <button className="btn btn-pr" onClick={()=>{setForm({nome:'',cpf:'',tel:'',email:'',dt_nasc:'',sexo:'M',endereco:'',cidade:'',estado:'AM'});setModal('add')}}>{I.add} Novo Paciente</button>
      </div>
      {pacs.length===0?(
        <div className="empty">

const HistView=({pacs,appts,laudos,pronts})=>{
  const[filtro,setFiltro]=useState('');
  const pacFilt=filtro?pacs.find(p=>p.id===filtro):null;

  if(!pacFilt&&filtro) return<div className="empty"><div className="empty-ico">❓</div><div className="empty-tt">Paciente não encontrado</div></div>;

  const eventos=[];
  if(pacFilt){
    appts.filter(a=>a.paciente_id===filtro).forEach(a=>eventos.push({tipo:'Agendamento',data:a.data,descr:`${a.tipo} às ${a.hora}`,ico:'📅'}));
    pronts.filter(p=>p.paciente_id===filtro).forEach(p=>eventos.push({tipo:'Prontuário',data:p.data,descr:p.queixa,ico:'📋'}));
    laudos.filter(l=>l.paciente_id===filtro).forEach(l=>eventos.push({tipo:'Laudo',data:l.data,descr:l.tipo,ico:'📄'}));
  }

  eventos.sort((a,b)=>new Date(b.data)-new Date(a.data));

  return(
    <div>
      <label className="f-lbl" style={{marginBottom:12}}>Selecione um paciente</label>
      <select className="f-ctl" style={{marginBottom:20}} value={filtro} onChange={e=>setFiltro(e.target.value)}>
        <option value="">Todos os pacientes</option>
        {pacs.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
      </select>
      {eventos.length===0?(
        <div className="empty">
          <div className="empty-ico">📜</div>
          <div className="empty-tt">Sem histórico</div>
          <div className="empty-dc">{filtro?'Este paciente não possui registros':'Selecione um paciente'}</div>
        </div>
      ):(
        <div className="card">
          {eventos.map((e,i)=>(
            <div key={i} className="appt-item">
              <span style={{fontSize:18}}>{e.ico}</span>
              <div style={{flex:1}}>
                <div className="appt-nm">{e.tipo}</div>
                <div className="appt-tp">{e.descr}</div>
              </div>
              <span className="appt-time">{new Date(e.data).toLocaleDateString('pt-BR')}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

              </select>

              <input className="f-ctl" type="text" value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} placeholder="Consulta, medicamento, etc"/>
              <div className="f-gr">
                <div>
                  <label className="f-lbl">Valor (R$) *</label>
                  <input className="f-ctl" type="number" step="0.01" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})} placeholder="0.00"/>
                </div>
                <div>
                  <label className="f-lbl">Data</label>
                  <input className="f-ctl" type="date" value={form.data} onChange={e=>setForm({...form,data:e.target.value})}/>
                </div>
              </div>
              <label className="f-lbl">Status</label>
              <select className="f-ctl" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                <option value="recebido">Recebido</option>
                <option value="pendente">Pendente</option>
              </select>
            </div>
            <div className="modal-ft">
              <button className="btn btn-se" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-pr" onClick={add}>{I.sav} Salvar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const BackupView=({pacs,appts,laudos,pronts,fins,setPacs,setAppts,setLaudos,setPronts,setFins,toast})=>{
  const exportar=()=>{
    const data={pacs,appts,laudos,pronts,fins,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`clinicpro_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    toast.add('Backup exportado','success');
  };

  const importar=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=async(evt)=>{
      try{
        const backup=JSON.parse(evt.target.result);
        setPacs(backup.pacs||[]);
        setAppts(backup.appts||[]);
        setLaudos(backup.laudos||[]);
        setPronts(backup.pronts||[]);
        setFins(backup.fins||[]);
        toast.add('Backup restaurado','success');
      }catch(err){
        toast.add('Erro ao restaurar backup','error');
      }
    };
    reader.readAsText(file);
  };

  const limpar=()=>{
    if(window.confirm('⚠️ Isso vai apagar TODOS os dados. Exporte um backup primeiro!\n\nTem certeza?')){
      setPacs([]);
      setAppts([]);
      setLaudos([]);
      setPronts([]);
      setFins([]);
      localStorage.clear();
      toast.add('Todos os dados foram apagados','success');
    }
  };

  return(
    <div>
      <div className="bk-card">
        <div className="bk-tt">☁️ Sincronização Firebase</div>
        <div className="bk-dc">Seus dados estão sincronizados em tempo real com o Firebase Firestore. Você pode acessar de qualquer dispositivo. {fbReady?'<strong>Firebase está ativo</strong>':'<strong style="color:var(--red)">Firebase não está configurado</strong>'}</div>
      </div>
      <div className="bk-card">
        <div className="bk-tt">💾 Backup Local</div>
        <div className="bk-dc">Faça backups regulares (.json) para manter uma cópia dos seus dados independente da nuvem.</div>
        <div className="bk-btns">
          <button className="btn btn-bk" onClick={exportar}>{I.bkup} Exportar Backup (.json)</button>
          <label className="btn btn-bk" style={{cursor:'pointer'}}>{I.add} Restaurar Backup<input type="file" accept=".json" style={{display:'none'}} onChange={importar}/></label>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:20}}>
        {[['👥','Pacientes',pacs.length],['📅','Agendamentos',appts.length],['📋','Prontuários',pronts.length],['📄','Laudos',laudos.length],['💰','Financeiro',fins.length]].map(([ico,lbl,val])=>(
          <div key={lbl} className="stat-card"><div className="stat-hd"><span className="stat-lbl">{lbl}</span><span style={{fontSize:18}}>{ico}</span></div><div className="stat-val">{val}</div><div className="stat-ch">registros</div></div>
        ))}
      </div>
      <div style={{padding:14,border:'1px solid #FCA5A5',borderRadius:10,background:'#FFF5F5'}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--red)',marginBottom:4}}>⚠️ Zona de Perigo</div>
        <div style={{fontSize:12,color:'#B91C1C',marginBottom:10}}>Irreversível. Exporte um backup antes.</div>
        <button className="btn btn-da" onClick={limpar}>🗑 Apagar Todos os Dados</button>
      </div>
    </div>
  );
};

// ── APP ──

          <div><div className="pg-title">{titles[pg].t}</div><div className="pg-sub">{titles[pg].s}</div></div>
          <span style={{fontSize:12,color:'var(--t3)',whiteSpace:'nowrap'}}>{new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</span>
